# Portal GD — o nginx que serve a tela e encaminha a API.
#
# PORTA 8080 e não 80: abaixo de 1024 exige root, e a imagem roda como `nginx`.
#
# SEM `pid` AQUI. Este arquivo vai para `conf.d/`, que o nginx inclui DENTRO do
# bloco `http` — e `pid` só vale no nível de cima. Com ela, o contêiner nem
# sobe: `[emerg] "pid" directive is not allowed here`. O `nginx.conf` principal
# da imagem já define `/var/run/nginx.pid`, e o Dockerfile dá o dono certo
# para o processo poder escrever nele sem ser root.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ───────────────────────────────────────────────────────────────────────────
  # `/api` VAI PARA O BACKEND, e é isso que faz o cookie funcionar.
  #
  # O cliente chama `/api/v1` na MESMA ORIGEM porque a sessão é `sameSite:
  # strict` e `httpOnly` — um domínio separado para a API faria o navegador
  # simplesmente não enviar o cookie, e o sintoma seria "entro e caio no login".
  #
  # O endereço é o Service do Kubernetes. Sem barra no fim do `proxy_pass`,
  # para o caminho chegar inteiro: com ela, `/api/v1/painel` viraria
  # `/v1/painel` e todas as rotas dariam 404.
  # ───────────────────────────────────────────────────────────────────────────
  location /api/ {
    # ─────────────────────────────────────────────────────────────────────────
    # RESOLUÇÃO EM TEMPO DE EXECUÇÃO, e não no arranque.
    #
    # `proxy_pass http://nome;` faz o nginx resolver o DNS UMA VEZ, ao subir —
    # e se o nome não resolver naquele instante ele **não sobe**:
    # `[emerg] host not found in upstream`. No cluster isso significa que o pod
    # do portal entra em CrashLoop sempre que o Service do backend ainda não
    # existir, e que um IP de Service trocado fica em cache para sempre.
    #
    # Pego montando a imagem em 14/09/2026: o contêiner morria no `docker run`.
    #
    # Com a URL numa VARIÁVEL, o nginx passa a resolver a cada requisição, e
    # `valid=10s` limita o cache. Quando o backend está fora, a resposta é 502
    # — que é a verdade — em vez de o portal inteiro não subir.
    #
    # `$request_uri` é obrigatório aqui: com `proxy_pass` variável o nginx
    # deixa de reescrever o caminho sozinho, e sem ele a rota chegaria vazia.
    #
    # Os dois `${...}` são preenchidos no arranque pelo `envsubst` do entrypoint
    # da imagem nginx, a partir do ambiente — e os dois vêm do chart, com
    # padrão no Dockerfile. As variáveis do NGINX (`$host`, `$scheme`,
    # `$request_uri`) usam `$` sem chaves e passam intactas.
    #
    # O RESOLVER É EXPLÍCITO de propósito. A imagem exporta um
    # `NGINX_LOCAL_RESOLVERS` lido do `/etc/resolv.conf`, e chegou a ser usado
    # aqui — só que ele não é substituído pelo `envsubst`, e o nginx morria com
    # `host not found in resolver "${NGINX_LOCAL_RESOLVERS}"`. Depender de um
    # detalhe interno da imagem para algo que derruba o contêiner não vale o
    # que economiza; assim o DNS do cluster fica escrito no `values.yaml`,
    # onde quem opera consegue ver e trocar.
    # ─────────────────────────────────────────────────────────────────────────
    resolver ${DNS_RESOLVER} valid=10s;
    set $upstream "http://${BACKEND_SERVICO}";
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # O backend sobe com `trustProxy: true` e LÊ estes cabeçalhos: é deles que
    # sai o IP gravado na auditoria e usado pelo limite de tentativas de login.
    # Sem eles, todo mundo teria o IP do nginx — e cinco tentativas erradas de
    # uma pessoa trancariam a empresa inteira por 15 minutos.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # As cargas e os relatórios pesados levam minutos. O padrão de 60s cortaria
    # a resposta no meio, e a tela leria como falha de rede.
    proxy_read_timeout 300s;
  }

  # Sonda do Kubernetes. Não toca no backend de propósito: esta é a prontidão
  # do NGINX, e derrubar a tela porque a API piscou só piora — o portal
  # continua servindo, e quem mostra o erro é a própria tela.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # ───────────────────────────────────────────────────────────────────────────
  # SPA: qualquer rota cai no `index.html`.
  #
  # O portal usa React Router, então `/reuniao-n3` não é arquivo nenhum. Sem
  # isto, recarregar a página em qualquer tela que não a raiz daria 404 do
  # nginx — e o sintoma clássico é "funciona navegando, quebra no F5".
  # ───────────────────────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Os assets do Vite levam hash no nome, então podem ser cacheados para
  # sempre. O `index.html` NÃO pode: é ele que aponta para o hash novo, e um
  # index cacheado serviria a versão velha depois do deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
